<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Travaux Chantier</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow p-6">
        <h1 class="text-xl font-bold mb-4 border-b pb-2">📋 Suivi des Travaux</h1>
        <div id="headerInfo" class="text-sm text-blue-700 mb-4 font-semibold"></div>
        
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-xs font-bold uppercase">Chantier :</label>
                <select id="selectChantier" class="w-full p-2 border rounded bg-gray-50"><option value="">Choisir...</option></select>
            </div>
            <div>
                <label class="block text-xs font-bold uppercase">Support :</label>
                <select id="selectSupport" class="w-full p-2 border rounded bg-gray-50" disabled><option value="">Choisir...</option></select>
            </div>
        </div>

        <div id="containerTaches" class="hidden space-y-3"></div>
        <button id="btnExport" class="w-full mt-6 bg-green-600 text-white font-bold py-4 rounded-lg hidden shadow-lg">📤 Exporter Global (Excel)</button>
    </div>

    <script>
        let rawData = [];
        let sessionRJ = "";
        let userName = localStorage.getItem('nomSutx') || "";

        window.addEventListener('DOMContentLoaded', () => {
            // 1. Récupération Nom (1 fois)
            if (!userName) {
                userName = prompt("Entrez votre Nom/Prénom :");
                localStorage.setItem('nomSutx', userName);
            }
            // 2. Récupération RJ (à chaque fois)
            sessionRJ = prompt("Entrez le Numéro RJ de ce chantier :");
            
            document.getElementById('headerInfo').innerText = `SUTX : ${userName} | RJ : ${sessionRJ}`;

            Papa.parse("data_tx_cat.csv", {
                download: true, header: true, delimiter: ";", skipEmptyLines: true,
                complete: (results) => {
                    rawData = results.data;
                    const chantiers = [...new Set(rawData.map(r => r.Chantier))];
                    chantiers.forEach(c => selectChantier.add(new Option(c, c)));
                }
            });
        });

        // Logique de sélection
        const selectChantier = document.getElementById('selectChantier');
        const selectSupport = document.getElementById('selectSupport');

        selectChantier.addEventListener('change', () => {
            selectSupport.innerHTML = '<option value="">Choisir...</option>';
            const filtered = [...new Set(rawData.filter(r => r.Chantier === selectChantier.value).map(r => r.Support))];
            filtered.forEach(s => selectSupport.add(new Option(s, s)));
            selectSupport.disabled = !selectChantier.value;
        });

        selectSupport.addEventListener('change', () => {
            const list = document.getElementById('containerTaches');
            list.innerHTML = '';
            rawData.filter(r => r.Chantier === selectChantier.value && r.Support === selectSupport.value).forEach((item) => {
                const isChecked = ['vrai', 'true', '1'].includes(String(item.Fait).toLowerCase().trim());
                list.innerHTML += `
                    <div class="p-3 bg-gray-50 rounded flex items-center gap-3">
                        <input type="checkbox" ${isChecked ? 'checked' : ''} 
                            onchange="rawData[rawData.indexOf(item)].Fait = this.checked ? 'Vrai' : 'Faux'" class="w-6 h-6">
                        <div class="flex-1 text-sm">${item.Tache}</div>
                        <input type="text" value="${item.Observation || ''}" placeholder="Obs..." 
                            oninput="rawData[rawData.indexOf(item)].Observation = this.value" class="w-1/3 p-1 border rounded">
                    </div>`;
            });
            list.classList.remove('hidden');
            document.getElementById('btnExport').classList.remove('hidden');
        });

        // Export Global avec infos session
        document.getElementById('btnExport').addEventListener('click', () => {
            const dateEnvoi = new Date().toLocaleString();
            const exportData = rawData.map(r => ({
                ...r,
                "SUTX": userName,
                "Numéro RJ": sessionRJ,
                "Date Envoi": dateEnvoi
            }));
            
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Suivi_Global");
            XLSX.writeFile(wb, `Suivi_RJ_${sessionRJ}_${new Date().toLocaleDateString()}.xlsx`);
        });
    </script>
</body>
</html>
