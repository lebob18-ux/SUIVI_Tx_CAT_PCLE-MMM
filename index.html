<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Travaux - SUTX</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" href="icon-192.png" type="image/png">

    <!-- Tailwind CSS, SheetJS, PapaParse -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- jsPDF et AutoTable pour un PDF pro -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-100 p-4 min-h-screen">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6">
        
        <!-- Barre des onglets de navigation -->
        <div class="flex gap-2 mb-6 border-b pb-4">
            <button id="tabPage1" onclick="changerOnglet(1)" class="flex-1 py-2 px-4 rounded-lg font-bold text-sm bg-blue-600 text-white shadow transition">
                📋 Saisie & Suivi
            </button>
            <button id="tabPage2" onclick="changerOnglet(2)" class="flex-1 py-2 px-4 rounded-lg font-bold text-sm bg-gray-200 text-gray-700 hover:bg-gray-300 transition">
                📊 Avancement Chantiers
            </button>
        </div>

        <!-- ================= PAGE 1 : SAISIE ================= -->
        <div id="page1">
            <!-- En-tête : Titre et Boutons d'action (Partager PDF & Copier) -->
            <div class="flex flex-wrap justify-between items-center mb-2 border-b pb-4 gap-2">
                <h1 class="text-xl font-bold text-gray-800">📋 Suivi des Travaux</h1>
                <div id="containerActions" class="hidden flex gap-2">
                    <button id="btnCopier" onclick="copierTravaux()" class="bg-gray-800 hover:bg-gray-900 text-white px-3 py-2 rounded-lg font-bold text-sm shadow transition flex items-center gap-1.5">
                        <span>📋</span> Copier
                    </button>
                    <button id="btnSharePDF" class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg font-bold text-sm shadow transition flex items-center gap-1.5">
                        <span>📄</span> Partager PDF
                    </button>
                </div>
            </div>
            
            <div id="headerInfo" class="text-sm text-blue-700 mb-6 font-semibold bg-blue-50 p-2.5 rounded-lg border border-blue-100"></div>
            
            <!-- Sélection Chantier & Support sur la même ligne -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Chantier :</label>
                    <select id="selectChantier" class="w-full p-2.5 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-500">
                        <option value="">Choisir...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Support :</label>
                    <select id="selectSupport" class="w-full p-2.5 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-500" disabled>
                        <option value="">Choisir...</option>
                    </select>
                </div>
            </div>

            <!-- Conteneur des tâches avec bouton d'ajout de tâche non prévue -->
            <div id="sectionTachesSupport" class="hidden space-y-3">
                <div class="flex justify-between items-center pt-2">
                    <h3 class="font-bold text-sm text-gray-700">Liste des tâches :</h3>
                    <button onclick="ouvrirModalAjoutTache()" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow transition flex items-center gap-1">
                        <span>➕</span> Ajouter un travail non prévu
                    </button>
                </div>
                <div id="containerTaches" class="space-y-3"></div>
            </div>
        </div>

        <!-- ================= PAGE 2 : AVANCEMENT CHANTIERS ================= -->
        <div id="page2" class="hidden">
            <div class="flex justify-between items-center mb-4 border-b pb-4">
                <h2 class="text-xl font-bold text-gray-800">📊 Avancement Global des Chantiers</h2>
                <button onclick="partagerPDFAvancement()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-bold shadow transition flex items-center gap-2 text-sm">
                    <span>📲</span> Partager PDF Avancement
                </button>
            </div>
            <div id="conteneurAvancement" class="space-y-4">
                <p class="text-gray-500 text-sm italic text-center py-4">Chargement de l'avancement...</p>
            </div>
        </div>

    </div>

    <!-- Modale pour demander le RJ lors d'une action de partage sur la Page 1 -->
    <div id="divRJModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-lg w-85 max-w-sm text-center">
            <p class="font-bold text-lg mb-2 text-gray-800">🌙 Numéro RJ requis</p>
            <p class="text-xs text-gray-600 mb-4">Veuillez indiquer le numéro RJ pour valider cette action :</p>
            <input type="text" id="rjInput" placeholder="Numéro RJ" class="w-full p-2 border rounded-lg mb-4 text-center font-bold focus:ring-2 focus:ring-blue-500">
            <div class="flex gap-2">
                <button onclick="executerActionEnAttente()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-lg font-bold text-sm">✅ Valider</button>
                <button onclick="document.getElementById('divRJModal').classList.add('hidden')" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 p-2 rounded-lg font-bold text-sm">❌ Annuler</button>
            </div>
        </div>
    </div>

    <!-- Modale pour ajouter un travail non prévu manuellement -->
    <div id="divAjoutTacheModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-lg w-90 max-w-sm">
            <p class="font-bold text-lg mb-2 text-gray-800 text-center">➕ Ajouter un travail non prévu</p>
            <p class="text-xs text-gray-600 mb-4 text-center">Ce travail n'aura pas d'ID (le VBA devra l'ajouter à la base globale).</p>
            <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Intitulé de la tâche :</label>
            <input type="text" id="inputNouvelleTache" placeholder="Ex: Reprise fondation spécifique..." class="w-full p-2.5 border rounded-lg mb-4 text-sm focus:ring-2 focus:ring-blue-500">
            <div class="flex gap-2">
                <button onclick="validerAjoutTacheManuelle()" class="flex-1 bg-green-600 hover:bg-green-700 text-white p-2 rounded-lg font-bold text-sm">✅ Ajouter</button>
                <button onclick="document.getElementById('divAjoutTacheModal').classList.add('hidden')" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 p-2 rounded-lg font-bold text-sm">❌ Annuler</button>
            </div>
        </div>
    </div>

    <script>
        let rawData = [];
        let sessionRJ = "";
        let userName = localStorage.getItem('nomSutx') || "";
        let actionEnCours = null;

        window.addEventListener('DOMContentLoaded', () => {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(console.error);
            }

            if (!userName) {
                userName = prompt("Entrez votre Nom/Prénom :") || "Inconnu";
                localStorage.setItem('nomSutx', userName);
            }
            
            document.getElementById('headerInfo').innerText = `👤 SUTX : ${userName}`;

            Papa.parse("data_tx_cat.csv", {
                download: true, header: true, delimiter: ";", skipEmptyLines: true,
                complete: (results) => {
                    rawData = results.data.map(r => ({ ...r, modifie: false, isCustom: false }));
                    const chantiers = [...new Set(rawData.map(r => r.Chantier))].filter(Boolean);
                    const selectChantier = document.getElementById('selectChantier');
                    chantiers.forEach(c => selectChantier.add(new Option(c, c)));

                    if (userName.toUpperCase().includes("LAVIGNON")) {
                        changerOnglet(2);
                    }
                }
            });
        });

        function changerOnglet(numPage) {
            const page1 = document.getElementById('page1');
            const page2 = document.getElementById('page2');
            const tab1 = document.getElementById('tabPage1');
            const tab2 = document.getElementById('tabPage2');

            if (numPage === 1) {
                page1.classList.remove('hidden');
                page2.classList.add('hidden');
                tab1.className = "flex-1 py-2 px-4 rounded-lg font-bold text-sm bg-blue-600 text-white shadow transition";
                tab2.className = "flex-1 py-2 px-4 rounded-lg font-bold text-sm bg-gray-200 text-gray-700 hover:bg-gray-300 transition";
            } else {
                page1.classList.add('hidden');
                page2.classList.remove('hidden');
                tab2.className = "flex-1 py-2 px-4 rounded-lg font-bold text-sm bg-blue-600 text-white shadow transition";
                tab1.className = "flex-1 py-2 px-4 rounded-lg font-bold text-sm bg-gray-200 text-gray-700 hover:bg-gray-300 transition";
                calculerEtAfficherAvancement();
            }
        }

        function calculerEtAfficherAvancement() {
            const conteneur = document.getElementById('conteneurAvancement');
            conteneur.innerHTML = '';

            const chantiers = [...new Set(rawData.map(r => r.Chantier))].filter(Boolean);

            if (chantiers.length === 0) {
                conteneur.innerHTML = '<p class="text-gray-500 text-sm text-center py-4">Aucune donnée disponible.</p>';
                return;
            }

            chantiers.forEach(chantier => {
                const lignesChantier = rawData.filter(r => r.Chantier === chantier);
                const totalTaches = lignesChantier.length;
                const tachesFaites = lignesChantier.filter(r => ['vrai', 'true', '1'].includes(String(r.Fait).toLowerCase().trim())).length;
                const pourcentage = totalTaches > 0 ? Math.round((tachesFaites / totalTaches) * 100) : 0;

                const divChantier = document.createElement('div');
                divChantier.className = "bg-gray-50 p-4 border rounded-lg shadow-sm";
                divChantier.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-gray-800">${chantier}</span>
                        <span class="text-sm font-semibold text-blue-600">${tachesFaites} / ${totalTaches} (${pourcentage}%)</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-3">
                        <div class="bg-blue-600 h-3 rounded-full transition-all duration-500" style="width: ${pourcentage}%"></div>
                    </div>
                `;
                conteneur.appendChild(divChantier);
            });
        }

        const selectChantier = document.getElementById('selectChantier');
        const selectSupport = document.getElementById('selectSupport');
        const containerTaches = document.getElementById('containerTaches');
        const sectionTachesSupport = document.getElementById('sectionTachesSupport');
        const containerActions = document.getElementById('containerActions');

        selectChantier.addEventListener('change', () => {
            selectSupport.innerHTML = '<option value="">Choisir...</option>';
            sectionTachesSupport.classList.add('hidden');
            containerTaches.innerHTML = '';
            const chantierChoisi = selectChantier.value;
            if (!chantierChoisi) {
                selectSupport.disabled = true;
                return;
            }
            const supports = [...new Set(rawData.filter(r => r.Chantier === chantierChoisi).map(r => r.Support))].filter(Boolean);
            supports.forEach(s => selectSupport.add(new Option(s, s)));
            selectSupport.disabled = false;
        });

        selectSupport.addEventListener('change', () => {
            rafraichirAffichageTaches();
        });

        function rafraichirAffichageTaches() {
            containerTaches.innerHTML = '';
            const chantierChoisi = selectChantier.value;
            const supportChoisi = selectSupport.value;

            if (!supportChoisi) {
                sectionTachesSupport.classList.add('hidden');
                containerActions.classList.add('hidden');
                return;
            }

            const lignesFiltrees = rawData.filter(r => r.Chantier === chantierChoisi && r.Support === supportChoisi);

            lignesFiltrees.forEach((item) => {
                const indexGlobal = rawData.indexOf(item);
                const isChecked = ['vrai', 'true', '1'].includes(String(item.Fait).toLowerCase().trim());
                
                const div = document.createElement('div');
                div.className = `p-3 border rounded-lg flex items-center gap-3 ${item.isCustom ? 'bg-amber-50 border-amber-200' : 'bg-gray-50'}`;
                div.innerHTML = `
                    <input type="checkbox" ${isChecked ? 'checked' : ''} 
                        onchange="modifierLigne(${indexGlobal}, 'Fait', this.checked ? 'Vrai' : 'Faux')" 
                        class="w-6 h-6 text-blue-600 rounded cursor-pointer">
                    <div class="flex-1 text-sm font-medium text-gray-800">
                        ${item.Tache} ${item.isCustom ? '<span class="text-xs bg-amber-200 text-amber-800 px-1.5 py-0.5 rounded font-bold ml-2">Hors CSV (Sans ID)</span>' : ''}
                    </div>
                    <input type="text" value="${item.Observation || ''}" placeholder="Observation..." 
                        oninput="modifierLigne(${indexGlobal}, 'Observation', this.value)" 
                        class="w-1/3 p-1.5 text-sm border rounded bg-white focus:ring-2 focus:ring-blue-500">
                `;
                containerTaches.appendChild(div);
            });

            sectionTachesSupport.classList.remove('hidden');
            containerActions.classList.remove('hidden');
        }

        window.modifierLigne = function(index, champ, valeur) {
            rawData[index][champ] = valeur;
            rawData[index].modifie = true;
        };

        function ouvrirModalAjoutTache() {
            document.getElementById('inputNouvelleTache').value = '';
            document.getElementById('divAjoutTacheModal').classList.remove('hidden');
        }

        function validerAjoutTacheManuelle() {
            const intitule = document.getElementById('inputNouvelleTache').value.trim();
            const chantierChoisi = selectChantier.value;
            const supportChoisi = selectSupport.value;

            if (!intitule) {
                alert("Veuillez saisir un intitulé pour ce travail.");
                return;
            }

            const nouvelleLigne = {
                ID: "", 
                Chantier: chantierChoisi,
                Support: supportChoisi,
                Tache: intitule,
                Fait: "Vrai",
                Observation: "Travail non prévu ajouté manuellement",
                modifie: true,
                isCustom: true
            };

            rawData.push(nouvelleLigne);
            document.getElementById('divAjoutTacheModal').classList.add('hidden');
            rafraichirAffichageTaches();
        }

        document.getElementById('btnSharePDF').addEventListener('click', () => {
            verifierModificationsEtDemanderRJ('pdf');
        });

        function copierTravaux() {
            copierDansPressePapier();
        }

        function verifierModificationsEtDemanderRJ(typeAction) {
            const elementsModifies = rawData.filter(r => r.modifie === true);

            if (elementsModifies.length === 0) {
                alert("Aucune modification n'a été effectuée pendant cette session.");
                return;
            }

            actionEnCours = typeAction;
            document.getElementById('rjInput').value = sessionRJ || "";
            document.getElementById('divRJModal').classList.remove('hidden');
        }

        function executerActionEnAttente() {
            const saisiRJ = document.getElementById('rjInput').value.trim();
            if (!saisiRJ) {
                alert("Veuillez entrer un numéro RJ valide.");
                return;
            }
            sessionRJ = saisiRJ;
            document.getElementById('divRJModal').classList.add('hidden');
            document.getElementById('headerInfo').innerText = `👤 SUTX : ${userName} | 📌 RJ : ${sessionRJ}`;

            if (actionEnCours === 'pdf') {
                genererEtPartagerPDF();
            }
        }

        // Copie optimisée : Support, Tâches faites et Observations associées
        async function copierDansPressePapier() {
            const elementsFaites = rawData.filter(r => r.modifie === true && ['vrai', 'true', '1'].includes(String(r.Fait).toLowerCase().trim()));

            if (elementsFaites.length === 0) {
                alert("Aucun travail validé (coché fait) n'a été trouvé pour la copie.");
                return;
            }

            // Grouper par Support
            const supportsGrouper = {};
            elementsFaites.forEach(r => {
                const support = r.Support || "Support inconnu";
                if (!supportsGrouper[support]) {
                    supportsGrouper[support] = [];
                }
                supportsGrouper[support].push({
                    tache: r.Tache,
                    observation: r.Observation ? r.Observation.trim() : ""
                });
            });

            // Construction du texte récapitulatif avec les observations
            let texteFinal = "";
            for (const [support, items] of Object.entries(supportsGrouper)) {
                texteFinal += `Support : ${support}\n`;
                items.forEach(item => {
                    if (item.observation) {
                        texteFinal += `- ${item.tache} (Obs: ${item.observation})\n`;
                    } else {
                        texteFinal += `- ${item.tache}\n`;
                    }
                });
                texteFinal += `\n`;
            }

            try {
                await navigator.clipboard.writeText(texteFinal.trim());
                alert("✅ Récapitulatif (avec observations) copié dans le presse-papiers !\n\nVous pouvez le coller (Ctrl+V) dans votre autre application.");
            } catch (err) {
                console.error("Erreur de copie : ", err);
                alert("Erreur lors de la copie automatique.");
            }
        }

        async function genererEtPartagerPDF() {
            const elementsModifies = rawData.filter(r => r.modifie === true);
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const dateEnvoi = new Date().toLocaleString();

            doc.setFillColor(37, 99, 235);
            doc.rect(0, 0, 210, 25, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(16);
            doc.text("RAPPORT DE SUIVI - TRAVAUX", 14, 16);

            doc.setTextColor(50, 50, 50);
            doc.setFontSize(11);
            doc.text(`Opérateur SUTX : ${userName}`, 14, 35);
            doc.text(`Numéro RJ : ${sessionRJ}`, 14, 42);
            doc.text(`Date d'envoi : ${dateEnvoi}`, 14, 49);

            const tableColumns = ["ID", "Chantier", "Support", "Tache", "Fait", "Observation"];
            const tableRows = elementsModifies.map(r => [
                r.ID || "SANS ID", r.Chantier, r.Support, r.Tache, r.Fait, r.Observation
            ]);

            doc.autoTable({
                startY: 55,
                head: [tableColumns],
                body: tableRows,
                theme: 'grid',
                headStyles: { fillColor: [37, 99, 235], textColor: [255, 255, 255] },
                styles: { fontSize: 9, cellPadding: 3 },
                didParseCell: function(data) {
                    if (data.row.raw[0] === "SANS ID") {
                        data.cell.styles.fillColor = [254, 243, 199];
                    }
                }
            });

            const pdfOutput = doc.output('blob');
            const fileName = `Suivi_Modifications_RJ_${sessionRJ}.pdf`;
            const file = new File([pdfOutput], fileName, { type: "application/pdf" });

            try {
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: 'Rapport Suivi Travaux',
                        text: `Bonjour, voici le rapport de suivi des travaux pour le RJ ${sessionRJ}.\nOpérateur : ${userName}`
                    });
                    return;
                }
            } catch (err) {
                if (err.name === 'AbortError') return;
            }

            doc.save(fileName);
        }

        async function partagerPDFAvancement() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const chantiers = [...new Set(rawData.map(r => r.Chantier))].filter(Boolean);

            doc.setFillColor(37, 99, 235);
            doc.rect(0, 0, 210, 25, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(16);
            doc.text("BILAN D'AVANCEMENT DES CHANTIERS", 14, 16);

            doc.setTextColor(50, 50, 50);
            doc.setFontSize(11);
            doc.text(`Opérateur : ${userName}`, 14, 35);

            const tableColumns = ["Chantier", "Tâches Réalisées", "Total Tâches", "Avancement"];
            const tableRows = chantiers.map(chantier => {
                const lignes = rawData.filter(r => r.Chantier === chantier);
                const total = lignes.length;
                const faites = lignes.filter(r => ['vrai', 'true', '1'].includes(String(r.Fait).toLowerCase().trim())).length;
                const pct = total > 0 ? Math.round((faites / total) * 100) : 0;
                return [chantier, faites, total, `${pct}%`];
            });

            doc.autoTable({
                startY: 45,
                head: [tableColumns],
                body: tableRows,
                theme: 'grid',
                headStyles: { fillColor: [37, 99, 235], textColor: [255, 255, 255] },
                styles: { fontSize: 10, cellPadding: 4 }
            });

            const pdfOutput = doc.output('blob');
            const fileName = `Avancement_Chantiers.pdf`;
            const file = new File([pdfOutput], fileName, { type: "application/pdf" });

            try {
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: 'Avancement Chantiers',
                        text: `Bonjour, voici le bilan d'avancement global des chantiers.\nOpérateur : ${userName}`
                    });
                    return;
                }
            } catch (err) {
                if (err.name === 'AbortError') return;
            }

            doc.save(fileName);
        }
    </script>
</body>
</html>
