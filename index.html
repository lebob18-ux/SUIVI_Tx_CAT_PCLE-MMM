<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Travaux</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow p-6">
        <!-- Titre avec bouton Partager en haut à droite -->
        <div class="flex justify-between items-center mb-4 border-b pb-4">
            <h1 class="text-xl font-bold">📋 Suivi des Travaux</h1>
            <button id="btnShare" class="hidden bg-blue-600 text-white px-4 py-2 rounded-lg font-bold shadow hover:bg-blue-700">
                📤 Partager
            </button>
        </div>
        
        <div id="headerInfo" class="text-sm text-blue-700 mb-4 font-semibold"></div>
        
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-xs font-bold uppercase">Chantier :</label>
                <select id="selectChantier" class="w-full p-2 border rounded bg-gray-50"><option value="">Choisir...</option></select>
            </div>
            <div>
                <label class="block text-xs font-bold uppercase">Support :</label>
                <select id="selectSupport" class="w-full p-2 border rounded bg-gray-50" disabled><option value="">Choisir...</option></select>
            </div>
        </div>

        <div id="containerTaches" class="hidden space-y-3"></div>
    </div>

    <script>
        let rawData = [];
        let sessionRJ = "";
        let userName = localStorage.getItem('nomSutx') || "";

        window.addEventListener('DOMContentLoaded', () => {
            if (!userName) {
                userName = prompt("Entrez votre Nom/Prénom :");
                localStorage.setItem('nomSutx', userName);
            }
            sessionRJ = prompt("Entrez le Numéro RJ de ce chantier :");
            document.getElementById('headerInfo').innerText = `SUTX : ${userName} | RJ : ${sessionRJ}`;

            Papa.parse("data_tx_cat.csv", {
                download: true, header: true, delimiter: ";", skipEmptyLines: true,
                complete: (results) => {
                    rawData = results.data;
                    const chantiers = [...new Set(rawData.map(r => r.Chantier))];
                    chantiers.forEach(c => selectChantier.add(new Option(c, c)));
                }
            });
        });

        // ... (Logique selectChantier et selectSupport identique)

        document.getElementById('selectSupport').addEventListener('change', () => {
             // ... afficher tâches ...
             document.getElementById('btnShare').classList.remove('hidden');
        });

        // Fonction de Partage
        document.getElementById('btnShare').addEventListener('click', async () => {
            const dateEnvoi = new Date().toLocaleString();
            const headerInfo = [
                ["SUTX", userName], ["Numéro RJ", sessionRJ], ["Date Envoi", dateEnvoi], [],
                ["ID", "Chantier", "Support", "Tache", "Fait", "Observation"]
            ];
            const dataRows = rawData.map(r => [r.ID, r.Chantier, r.Support, r.Tache, r.Fait, r.Observation]);
            
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([...headerInfo, ...dataRows]), "Suivi");
            
            // Conversion en Blob pour partage
            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
            const file = new File([new Blob([wbout])], `Suivi_RJ_${sessionRJ}.xlsx`, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file], title: 'Export Suivi Travaux', text: 'Voici le suivi RJ ' + sessionRJ });
            } else {
                // Fallback si le partage n'est pas supporté
                XLSX.writeFile(wb, `Suivi_RJ_${sessionRJ}.xlsx`);
            }
        });
    </script>
</body>
</html>
